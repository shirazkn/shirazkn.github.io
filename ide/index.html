<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Editor</title>
<script>/*DARK_MODE_INJECT*/</script>

<script>
MathJax = {
  tex: {
    packages: {'[+]': ['mathtools', 'amscd']},
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    inlineMath: [['\\(', '\\)'], ['$', '$']]
  },
  loader: { load: ['ui/safe', '[tex]/mathtools', '[tex]/amscd'] },
  startup: { typeset: false }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.2.4/dist/index.umd.js"></script>

<!-- Prism: syntax highlighting for preview (manual mode so it doesn't run on load) -->
<script>window.Prism = { manual: true };</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
if (window.Prism && Prism.plugins && Prism.plugins.autoloader) {
  Prism.plugins.autoloader.languages_path = 'https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';
}
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ide-bg: #f5f5f5;
  --ide-bg2: #eaeaea;
  --ide-fg: #222;
  --ide-fg2: #999;
  --ide-accent: #bc0a5c;
  --ide-accent-hover: #a00850;
  --ide-border: #ddd;
  --ide-editor-bg: #f6f5f4;
  --ide-editor-fg: #1e1e1e;
  --ide-sidebar-bg: #eeedec;
  --ide-hover: rgba(0,0,0,0.04);
  --ide-active-bg: rgba(188,10,92,0.08);
  --pv-bg: #f6f5f4;
  --pv-fg: rgb(31,31,31);
  --pv-secondary: rgb(122,125,124);
  --pv-tertiary: rgb(195,194,194);
  --pv-accent: rgb(188,10,92);
  --pv-code-bg: rgb(224,223,223);
  --pv-pre-bg: rgb(28,29,33);
  --pv-pre-fg: #e0e0e0;
  --pv-aside-border: rgb(230,230,230);
  --pv-aside-shadow: rgb(203,198,195);
  --pv-aside-bg: transparent;
}

.dark-mode {
  --ide-bg: #0c0c0e;
  --ide-bg2: #101012;
  --ide-fg: #b8b8b8;
  --ide-fg2: #555;
  --ide-accent: #c44a7a;
  --ide-accent-hover: #d86e96;
  --ide-border: #1c1c20;
  --ide-editor-bg: #0e0e11;
  --ide-editor-fg: #d0d0d4;
  --ide-sidebar-bg: #0e0e11;
  --ide-hover: rgba(255,255,255,0.025);
  --ide-active-bg: rgba(196,74,122,0.1);
  --pv-bg: #0e0e11;
  --pv-fg: rgb(190,190,194);
  --pv-secondary: rgb(110,110,112);
  --pv-tertiary: rgb(44,44,50);
  --pv-accent: rgb(196,74,122);
  --pv-code-bg: rgb(24,24,28);
  --pv-pre-bg: rgb(16,16,20);
  --pv-pre-fg: #a8a8ac;
  --pv-aside-border: rgba(40,40,46,0.7);
  --pv-aside-shadow: rgba(0,0,0,0.5);
  --pv-aside-bg: rgba(12,12,15,0.5);
}

html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--ide-bg); color: var(--ide-fg);
}

#app { display: flex; height: 100vh; }

#sidebar {
  width: 220px; background: var(--ide-sidebar-bg);
  border-right: 1px solid var(--ide-border);
  display: flex; flex-direction: column;
  transition: width 0.2s, opacity 0.15s;
  overflow: hidden; flex-shrink: 0;
}
#sidebar.collapsed { width: 0; min-width: 0; border-right: none; opacity: 0; pointer-events: none; padding: 0; }

#sidebar-toggle {
  background: none; border: none;
  color: var(--ide-fg2); width: 26px; height: 26px;
  border-radius: 4px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
#sidebar-toggle:hover { color: var(--ide-accent); }

#sidebar-header {
  padding: 9px 14px 7px;
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--ide-fg2); border-bottom: 1px solid var(--ide-border);
}
#search-input {
  display: block; margin: 6px 10px; padding: 4px 8px; width: calc(100% - 20px);
  background: var(--ide-bg); border: 1px solid var(--ide-border);
  border-radius: 3px; color: var(--ide-fg); font-size: 11px; outline: none;
}
#search-input:focus { border-color: var(--ide-accent); }
#post-list { flex: 1; overflow-y: auto; padding: 2px 0; }
.post-item {
  padding: 5px 14px; cursor: pointer; font-size: 12px;
  border-left: 2px solid transparent; transition: background 0.1s;
  display: flex; justify-content: space-between; align-items: center;
  white-space: nowrap; overflow: hidden;
}
.post-item:hover { background: var(--ide-hover); }
.post-item.active { border-left-color: var(--ide-accent); background: var(--ide-active-bg); }
.post-item .title { overflow: hidden; text-overflow: ellipsis; }
.draft-badge {
  font-size: 9px; background: var(--ide-accent); color: white;
  padding: 0 5px; border-radius: 3px; margin-left: 6px; flex-shrink: 0;
}
.page-badge {
  font-size: 9px; background: var(--ide-fg2); color: white;
  padding: 0 5px; border-radius: 3px; margin-left: 6px; flex-shrink: 0;
}

#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

#toolbar {
  height: 34px; min-height: 34px; background: var(--ide-bg2);
  border-bottom: 1px solid var(--ide-border);
  display: flex; align-items: center; padding: 0 8px; gap: 6px; font-size: 12px;
}
.filename { font-weight: 600; color: var(--ide-accent); font-size: 12px; }
.modified-dot { width: 6px; height: 6px; border-radius: 50%; background: #e8a030; display: none; }
.modified-dot.visible { display: block; }
.spacer { flex: 1; }
#save-status { font-size: 10px; color: var(--ide-fg2); }
.tb-btn {
  background: none; border: none; color: var(--ide-fg2);
  cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 3px;
}
.tb-btn:hover { color: var(--ide-accent); }
.tb-btn.active { color: var(--ide-accent); background: var(--ide-active-bg); }

#panes { flex: 1; display: flex; min-height: 0; }

#editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }

#editor-textarea {
  flex: 1; width: 100%; min-height: 0;
  resize: none; border: none; outline: none;
  background: var(--ide-editor-bg); color: var(--ide-editor-fg);
  padding: 20px 24px;
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
  font-size: 13.5px; line-height: 1.7; tab-size: 2;
}
#editor-textarea.no-wrap { white-space: pre; overflow-x: auto; }
#editor-textarea::placeholder { color: var(--ide-fg2); }

/* CodeMirror fill */
#editor-pane .cm-editor {
  flex: 1; min-height: 0;
}
#editor-pane .cm-editor .cm-scroller {
  font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
  font-size: 13.5px; line-height: 1.7;
  padding: 12px 0;
}
.cm-editor { background: var(--ide-editor-bg); color: var(--ide-editor-fg); }
.cm-editor .cm-gutters {
  background: var(--ide-editor-bg); color: var(--ide-fg2);
  border-right: 1px solid var(--ide-border);
}
.cm-editor .cm-activeLineGutter { color: var(--ide-fg); }
.cm-editor .cm-activeLine { background: var(--ide-active-bg); }
.cm-editor .cm-selectionBackground, .cm-editor ::selection {
  background: color-mix(in srgb, var(--ide-accent) 15%, transparent) !important;
}
.cm-editor .cm-cursor { border-left-color: var(--ide-accent); }
.cm-editor .cm-line { padding-left: 4px; }

/* Math decoration colors — span override prevents markdown emphasis/punct bleeding in */
.cm-editor .cm-math-mark { color: #d49030; }
.cm-editor .cm-math-content,
.cm-editor .cm-math-content span { color: #b07828 !important; font-style: normal !important; }
.dark-mode .cm-editor .cm-math-mark { color: #f9e2af; }
.dark-mode .cm-editor .cm-math-content,
.dark-mode .cm-editor .cm-math-content span { color: #e0c070 !important; font-style: normal !important; }

#resize-handle {
  width: 4px; cursor: col-resize; background: var(--ide-border);
  transition: background 0.15s; flex-shrink: 0;
}
#resize-handle:hover, #resize-handle.dragging { background: var(--ide-accent); }

#preview-pane {
  flex: 1; overflow-y: auto; min-width: 0;
  background: var(--pv-bg); padding: 36px 44px;

}

/* Heading TOC overlay */
#toc {
  position: absolute; top: 42px; right: 12px; z-index: 50;
  max-width: 200px; max-height: calc(100% - 80px); overflow-y: auto;
  font-size: 11px; line-height: 1.5;
  padding: 4px 2px;
  opacity: 0; transition: opacity 0.2s, background 0.2s;
  border-radius: 4px;
}
#toc:hover {
  opacity: 1;
  background: color-mix(in srgb, var(--pv-bg) 85%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#toc a {
  display: block; color: var(--pv-fg); text-decoration: none;
  padding: 1px 8px; border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#toc a:hover { color: var(--pv-accent); border-left-color: var(--pv-accent); }
#toc a.toc-h3 { padding-left: 18px; font-size: 10px; }
#toc a.toc-h4 { padding-left: 28px; font-size: 10px; }

#drop-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(188,10,92,0.08); border: 3px dashed var(--ide-accent);
  z-index: 999; align-items: center; justify-content: center;
  font-size: 18px; color: var(--ide-accent); pointer-events: none;
}
#drop-overlay.visible { display: flex; }

#status-bar {
  height: 22px; min-height: 22px; background: var(--ide-bg2);
  border-top: 1px solid var(--ide-border);
  display: flex; align-items: center; padding: 0 14px;
  font-size: 10px; color: var(--ide-fg2); gap: 16px;
}

/* ===== Preview ===== */
.pv {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  color: var(--pv-fg); font-size: 16px; line-height: 1.7; max-width: 720px; margin: 0 auto;
}
.pv h1 { font-size: 1.8em; margin: 0.8em 0 0.4em; }
.pv h2 { font-size: 1.4em; margin: 1.2em 0 0.4em; }
.pv h3 { font-size: 1.2em; margin: 1em 0 0.3em; }
.pv h4 { font-size: 1.1em; margin: 0.8em 0 0.3em; }
.pv p { margin: 0.8em 0; text-align: justify; }
.pv ul, .pv ol { margin: 0.8em 0; padding-left: 1.8em; }
.pv li { margin: 0.3em 0; }
.pv li > p { margin: 0.3em 0; }
.pv img { max-width: 100%; height: auto; border-radius: 4px; margin: 1em 0; }
.pv figure { margin: 1.2em auto; text-align: center; }
.pv figure img { margin: 0; }
.pv figcaption { font-size: 0.85em; opacity: 0.65; margin-top: 0.4em; }
/* invertible: dark mode inverts; deinvertible: light mode inverts */
html.dark-mode .pv figure.invertible img,
html.dark-mode .pv img.invertible { filter: invert(0.875) hue-rotate(180deg); }
.pv figure.deinvertible img,
.pv img.deinvertible { filter: invert(0.875) hue-rotate(180deg); }
html.dark-mode .pv figure.deinvertible img,
html.dark-mode .pv img.deinvertible { filter: none; }
.pv a { color: var(--pv-accent); }
.pv code { background: var(--pv-code-bg); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
.pv pre { background: var(--pv-pre-bg); color: var(--pv-pre-fg); padding: 16px; border-radius: 6px; overflow-x: auto; margin: 1em 0; }
.pv pre code { background: none; padding: 0; color: inherit; }
.pv hr { border: none; border-top: 1px solid var(--ide-border); margin: 2em 0; }
.pv blockquote {
  opacity: 0.9; font-family: 'IM Fell DW Pica', Times, serif; font-size: 1.1em;
  max-width: 99.5%; margin: auto; padding: 0px 20px;
  border-left: 2px solid var(--pv-accent);
}
.pv table { border-collapse: collapse; margin: 1em 0; }
.pv th, .pv td { border: 1px solid var(--ide-border); padding: 8px 12px; }
.pv sup a { color: var(--pv-accent); text-decoration: none; font-size: 0.8em; }

.pv .accented { color: var(--pv-accent); }
.pv .red { color: red; }
.pv .gray { color: var(--pv-secondary); }
.pv .boxed {
  border: 1px solid var(--pv-tertiary); text-align: center;
  padding: 0.25rem 0.75rem 0.5rem; border-radius: 2px; display: inline-block;
}
.pv .centred { padding: 0 5%; text-align: center; }
.pv .faded { opacity: 0.25; }
.pv .tertiary { opacity: 0.5; }
.pv .secondary { opacity: 0.7; }
.pv .equation-like { padding: 0 5%; display: table; }

.pv aside {
  width: 46%; margin: 0 0.95rem 0 -0.4rem; padding: 0.8em 1.3em 0em 1.3em;
  float: left;
  border-right: 1px solid var(--pv-aside-border);
  border-bottom: 0.5px solid var(--pv-aside-border);
  box-shadow: inset -0.1em 0.1em 0.2em 0 var(--pv-aside-shadow), 0.2em 0.04em 0.5em 0.2em rgba(0,0,0,0.02);
  color: var(--pv-secondary); border-radius: 25px; font-size: 0.90em; text-align: justify;
  background: var(--pv-aside-bg);
}
.pv aside.aside-right {
  margin: 0.5em -0.4rem 0.5em 0.75rem; float: right; padding-bottom: 1em;
  border-right: 0; border-left: 1px solid var(--pv-aside-border);
  box-shadow: inset 0.1em 0.1em 0.2em 0 var(--pv-aside-shadow), -0.2em 0.04em 0.5em 0.2em rgba(0,0,0,0.02);
}
.pv aside.aside-center {
  width: 102%; float: none; margin: 1em 0 1em -0.5em;
  border-right: 0; border-left: 1px solid var(--pv-aside-border); padding-bottom: 1em;
  box-shadow: inset 0.1em 0.1em 0.2em 0 var(--pv-aside-shadow), -0.2em 0.04em 0.5em 0.2em rgba(0,0,0,0.02);
}
.pv .print b { color: var(--pv-secondary); font-weight: 500; }
.pv .print { opacity: 0.9; font-family: 'IM Fell DW Pica', Times, serif; font-size: 1.1em; }
.pv .footnotes { font-size: 0.85em; border-top: 1px solid var(--ide-border); margin-top: 2em; padding-top: 1em; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ide-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ide-fg2); }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">Posts</div>
    <input type="text" id="search-input" placeholder="Filter...">
    <div id="post-list"></div>
  </div>

  <div id="main">
    <div id="toolbar">
      <button id="sidebar-toggle" title="Toggle sidebar (Ctrl+B)">&#9776;</button>
      <span class="filename" id="current-file"></span>
      <div class="modified-dot" id="modified-dot"></div>
      <div class="spacer"></div>
      <span id="save-status"></span>
      <button class="tb-btn" id="wrap-btn" title="Toggle line wrap (Ctrl+L)">wrap</button>
      <button class="tb-btn" id="server-btn" title="Open Hugo preview server (localhost:1313)">server</button>
    </div>

    <div id="panes">
      <div id="editor-pane">
        <textarea id="editor-textarea" spellcheck="false" placeholder="Select a post from the sidebar to start editing."></textarea>
      </div>
      <div id="resize-handle"></div>
      <div id="preview-pane">
        <div id="toc"></div>
        <div class="pv" id="preview"></div>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-cursor">Ln 1, Col 1</span>
      <span id="status-words"></span>
      <span id="status-msg"></span>
    </div>
  </div>
</div>

<div id="drop-overlay">Drop image here</div>

<script>
(function() {
  "use strict";

  // ---- DOM ----
  var ta = document.getElementById("editor-textarea");
  var postList = document.getElementById("post-list");
  var searchInput = document.getElementById("search-input");
  var preview = document.getElementById("preview");
  var toc = document.getElementById("toc");
  var currentFileEl = document.getElementById("current-file");
  var modifiedDot = document.getElementById("modified-dot");
  var saveStatus = document.getElementById("save-status");
  var statusCursor = document.getElementById("status-cursor");
  var statusWords = document.getElementById("status-words");
  var statusMsg = document.getElementById("status-msg");
  var editorPane = document.getElementById("editor-pane");
  var previewPane = document.getElementById("preview-pane");
  var resizeHandle = document.getElementById("resize-handle");
  var dropOverlay = document.getElementById("drop-overlay");
  var sidebar = document.getElementById("sidebar");
  var sidebarToggle = document.getElementById("sidebar-toggle");
  var wrapBtn = document.getElementById("wrap-btn");
  var serverBtn = document.getElementById("server-btn");

  // ---- State ----
  var currentFile = null;
  var originalContent = "";
  var isModified = false;
  var autoSaveTimer = null;
  var allPosts = [];
  var wordWrap = true;
  var lastKnownMtime = 0;
  var watchTimer = null;
  var mathGeneration = 0;

  // ============================================================
  // Editor abstraction — wraps textarea, upgrades to CM if loaded
  // ============================================================
  var E = {
    _cm: null,
    getValue: function() { return this._cm ? this._cm.state.doc.toString() : ta.value; },
    setValue: function(text) {
      if (this._cm) {
        this._cm.dispatch({ changes: { from: 0, to: this._cm.state.doc.length, insert: text } });
      } else {
        ta.value = text;
      }
    },
    getCursor: function() {
      return this._cm ? this._cm.state.selection.main.head : ta.selectionStart;
    },
    insertAt: function(pos, text, cursorOffset) {
      if (this._cm) {
        var anchor = pos + (cursorOffset != null ? cursorOffset : text.length);
        this._cm.dispatch({ changes: { from: pos, insert: text }, selection: { anchor: anchor } });
        this._cm.focus();
      } else {
        ta.value = ta.value.slice(0, pos) + text + ta.value.slice(ta.selectionEnd);
        var cp = pos + (cursorOffset != null ? cursorOffset : text.length);
        ta.selectionStart = ta.selectionEnd = cp;
        ta.focus();
      }
      onEditorChange();
    },
    focus: function() { this._cm ? this._cm.focus() : ta.focus(); },
    scrollTop: function(v) {
      var dom = this._cm ? this._cm.scrollDOM : ta;
      if (v !== undefined) { dom.scrollTop = v; return; }
      return dom.scrollTop;
    },
    scrollFrac: function() {
      var dom = this._cm ? this._cm.scrollDOM : ta;
      return dom.scrollTop / Math.max(1, dom.scrollHeight - dom.clientHeight);
    },
    setScrollFrac: function(f) {
      var dom = this._cm ? this._cm.scrollDOM : ta;
      dom.scrollTop = f * (dom.scrollHeight - dom.clientHeight);
    },
    scrollDOM: function() { return this._cm ? this._cm.scrollDOM : ta; },
  };

  // ---- Sidebar ----
  var sidebarOpen = true;
  var firstPostOpened = false;
  sidebarToggle.addEventListener("click", function() {
    sidebarOpen = !sidebarOpen;
    if (sidebarOpen) {
      sidebar.style.display = "";
      // Force reflow so the transition runs
      sidebar.offsetWidth;
      sidebar.classList.remove("collapsed");
    } else {
      sidebar.classList.add("collapsed");
      // After transition, hide completely to avoid layout cost
      sidebar.addEventListener("transitionend", function hide() {
        if (!sidebarOpen) sidebar.style.display = "none";
        sidebar.removeEventListener("transitionend", hide);
      });
    }
  });

  // ---- Line wrap toggle ----
  wrapBtn.classList.add("active");
  wrapBtn.addEventListener("click", toggleWrap);
  function toggleWrap() {
    wordWrap = !wordWrap;
    ta.classList.toggle("no-wrap", !wordWrap);
    wrapBtn.classList.toggle("active", wordWrap);
    // TODO: CM wrap reconfigure if needed
  }

  // ---- Posts ----
  function loadPosts(cb) {
    fetch("/api/posts").then(function(r) { return r.json(); }).then(function(posts) {
      allPosts = posts;
      renderPostList();
      if (cb) cb();
    }).catch(function() { flash("Failed to load posts"); });
  }

  function renderPostList(filter) {
    var f = (filter || "").toLowerCase();
    var list = allPosts.filter(function(p) {
      return p.title.toLowerCase().indexOf(f) >= 0 || p.filename.toLowerCase().indexOf(f) >= 0;
    });
    postList.innerHTML = list.map(function(p) {
      var badge = "";
      if (p.filename === "about.md") badge = '<span class="page-badge">page</span>';
      else if (p.draft) badge = '<span class="draft-badge">draft</span>';
      return '<div class="post-item' + (p.filename === currentFile ? ' active' : '') + '" data-file="' + esc(p.filename) + '">'
        + '<span class="title">' + esc(p.title) + '</span>'
        + badge
        + '</div>';
    }).join("");
    var items = postList.querySelectorAll(".post-item");
    for (var i = 0; i < items.length; i++) {
      (function(el) {
        el.addEventListener("click", function(e) {
          if (e.metaKey || e.ctrlKey) {
            window.open("/?file=" + encodeURIComponent(el.getAttribute("data-file")), "_blank");
          } else {
            openPost(el.getAttribute("data-file"));
          }
        });
      })(items[i]);
    }
  }

  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  searchInput.addEventListener("input", function() { renderPostList(searchInput.value); });

  // ---- File watching ----
  function startFileWatch() {
    clearInterval(watchTimer);
    lastKnownMtime = 0;
    if (!currentFile) return;
    watchTimer = setInterval(function() {
      if (!currentFile) return;
      fetch("/api/posts/" + encodeURIComponent(currentFile) + "/mtime")
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d.mtime) return;
          if (lastKnownMtime === 0) { lastKnownMtime = d.mtime; return; }
          if (d.mtime === lastKnownMtime) return;
          lastKnownMtime = d.mtime;
          if (isModified) { flash("File changed on disk (unsaved changes kept)"); return; }
          fetch("/api/posts/" + encodeURIComponent(currentFile))
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.content === E.getValue()) return;
              var frac = E.scrollFrac();
              E.setValue(data.content);
              originalContent = data.content;
              E.setScrollFrac(frac);
              updatePreview();
              flash("Reloaded from disk");
            }).catch(function() {});
        }).catch(function() {});
    }, 1000);
  }

  // ---- Open / Save ----
  function openPost(filename) {
    if (isModified && currentFile && !confirm("Unsaved changes. Discard?")) return;
    fetch("/api/posts/" + encodeURIComponent(filename))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        currentFile = filename;
        originalContent = data.content;
        isModified = false;
        currentFileEl.textContent = filename;
        modifiedDot.classList.remove("visible");
        E.setValue(data.content);
        renderPostList(searchInput.value);
        updatePreview();
        E.focus();
        E.scrollTop(0);
        startFileWatch();
        if (!firstPostOpened) { firstPostOpened = true; if (sidebarOpen) sidebarToggle.click(); }
      })
      .catch(function() { flash("Failed to open file"); });
  }

  function savePost() {
    if (!currentFile) return;
    var content = E.getValue();
    if (content === originalContent) {
      isModified = false;
      modifiedDot.classList.remove("visible");
      return;
    }
    fetch("/api/posts/" + encodeURIComponent(currentFile), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: content }),
    }).then(function() {
      originalContent = content;
      isModified = false;
      modifiedDot.classList.remove("visible");
      lastKnownMtime = Date.now();
      saveStatus.textContent = "saved";
      setTimeout(function() { if (saveStatus.textContent === "saved") saveStatus.textContent = ""; }, 2000);
    }).catch(function() { flash("Save failed"); });
  }

  // ---- Publish ----
  function doPublish() {
    var msg = prompt("Commit message for publish:", "update blog");
    if (msg === null) return;
    var content = E.getValue();
    if (isModified && currentFile) {
      fetch("/api/posts/" + encodeURIComponent(currentFile), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content }),
      }).then(function() {
        originalContent = content;
        isModified = false;
        modifiedDot.classList.remove("visible");
        runPublish(msg);
      }).catch(function() { flash("Save failed, aborting publish"); });
    } else {
      runPublish(msg);
    }
  }

  function runPublish(msg) {
    flash("Publishing...");
    fetch("/api/publish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data.ok) {
        flash("Published!");
      } else {
        flash("Publish failed: " + (data.error || "unknown error"));
        console.error("publish stdout:", data.stdout);
        console.error("publish stderr:", data.stderr);
      }
    }).catch(function(e) { flash("Publish error: " + e.message); });
  }

  // ---- Editor change handler (shared by textarea and CM) ----
  var previewTimer = null;
  var fastMathTimer = null;
  function onEditorChange() {
    if (!isModified) { isModified = true; modifiedDot.classList.add("visible"); }
    clearTimeout(fastMathTimer);
    clearTimeout(previewTimer);
    clearTimeout(autoSaveTimer);
    fastMathTimer = setTimeout(updateCurrentEquation, 200);
    previewTimer = setTimeout(function() { renderMarkdown().then(runMathJax); }, 1000);
    autoSaveTimer = setTimeout(savePost, 3000);
  }

  // Textarea fallback events
  ta.addEventListener("input", onEditorChange);
  ta.addEventListener("keyup", updateCursorTA);
  ta.addEventListener("click", updateCursorTA);

  function updateCursorTA() {
    var pos = ta.selectionStart;
    var lines = ta.value.slice(0, pos).split("\n");
    statusCursor.textContent = "Ln " + lines.length + ", Col " + (lines[lines.length - 1].length + 1);
  }

  ta.addEventListener("keydown", function(e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var s = ta.selectionStart;
      ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + 2;
      ta.dispatchEvent(new Event("input"));
    }
  });

  // ---- Preview ----
  function stripFrontMatter(text) {
    var m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    if (m) return { fm: m[1], body: m[2] };
    return { fm: "", body: text };
  }

  // Yield to the browser between expensive steps so input events are never blocked.
  // scheduler.yield() (Chrome 115+) is ideal; setTimeout(0) is the universal fallback.
  var _yield = (typeof scheduler !== 'undefined' && scheduler.yield)
    ? function() { return scheduler.yield(); }
    : function() { return new Promise(function(r) { setTimeout(r, 0); }); };

  // Returns {idx, content} if cursor is inside a math block, else null.
  function getMathAtCursor() {
    var text = E.getValue();
    var offset = E.getCursor();
    var re = /\$\$[\s\S]*?\$\$|\$(?!\$|\s)(?:[^$\n\\]|\\.)*(?<!\s)\$/g;
    var m, idx = 0;
    while ((m = re.exec(text)) !== null) {
      if (offset >= m.index && offset <= m.index + m[0].length) {
        return { idx: idx, content: m[0] };
      }
      idx++;
    }
    return null;
  }

  // Fast path: re-typeset only the equation the cursor is in.
  var _mathEqBusy = false;
  async function updateCurrentEquation() {
    if (_mathEqBusy) return;
    if (!window.MathJax || !MathJax.typesetPromise) return;
    var info = getMathAtCursor();
    if (!info) return;
    var elem = preview.querySelector('[data-math-idx="' + info.idx + '"]');
    if (!elem) return;
    _mathEqBusy = true;
    try {
      if (window.MathJax.typesetClear) MathJax.typesetClear([elem]);
      elem.textContent = info.content;
      await MathJax.typesetPromise([elem]);
      elem.setAttribute('data-typeset', '1');
    } catch(e) {}
    finally { _mathEqBusy = false; }
  }

  async function renderMarkdown() {
    mathGeneration++;  // cancel any in-progress runMathJax
    var text = E.getValue();
    var parsed = stripFrontMatter(text);
    var body = parsed.body;
    var wc = body.trim() ? body.trim().split(/\s+/).length : 0;
    statusWords.textContent = wc + " words";

    await _yield();

    // Protect math from marked, and tag each block with a stable index.
    var mathCache = [];
    var safe = body.replace(/\$\$[\s\S]*?\$\$|\$(?!\$|\s)(?:[^$\n\\]|\\.)*(?<!\s)\$/g, function(m) {
      return '\x02' + (mathCache.push(m) - 1) + '\x03';
    });
    var html = marked.parse(safe);
    html = html.replace(/\x02(\d+)\x03/g, function(_, i) {
      return '<span class="math-eq" data-math-idx="' + i + '">' + mathCache[+i] + '</span>';
    });

    await _yield();

    preview.innerHTML = html;
    if (window.Prism) Prism.highlightAllUnder(preview);
    buildToc();
  }

  // Typeset all not-yet-typeset equations, yielding between each.
  async function runMathJax() {
    if (!window.MathJax || !MathJax.typesetPromise) return;
    var gen = ++mathGeneration;
    var elems = Array.from(preview.querySelectorAll('[data-math-idx]'));
    for (var i = 0; i < elems.length; i++) {
      await _yield();
      if (mathGeneration !== gen) return;
      if (!preview.contains(elems[i])) continue;
      if (elems[i].getAttribute('data-typeset')) continue;  // already done by fast path
      try {
        await MathJax.typesetPromise([elems[i]]);
        elems[i].setAttribute('data-typeset', '1');
      } catch(e) {}
    }
  }

  function updatePreview() {
    renderMarkdown().then(runMathJax);
  }

  // ---- TOC ----
  function buildToc() {
    var headings = preview.querySelectorAll("h2, h3, h4");
    if (headings.length === 0) { toc.innerHTML = ""; return; }
    var html = "";
    for (var i = 0; i < headings.length; i++) {
      var h = headings[i];
      var id = "hd-" + i;
      h.id = id;
      var level = h.tagName.toLowerCase();
      var cls = level === "h3" ? " toc-h3" : level === "h4" ? " toc-h4" : "";
      html += '<a class="' + cls + '" data-target="' + id + '">' + h.textContent + '</a>';
    }
    toc.innerHTML = html;
  }

  toc.addEventListener("click", function(e) {
    var a = e.target.closest("a[data-target]");
    if (!a) return;
    var el = document.getElementById(a.getAttribute("data-target"));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // ---- Scroll sync: disabled (scroll each pane independently) ----
  var mjBusy = false;
  function setupEditorScroll() {} // no-op, called by CM loader

  // ---- Clipboard paste ----
  function pasteImageIfAny(e) {
    if (!currentFile) return;
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image/") === 0) {
        e.preventDefault();
        e.stopPropagation();
        var file = items[i].getAsFile();
        if (!file) continue;
        var ext = file.type.split("/")[1] || "png";
        if (ext === "jpeg") ext = "jpg";
        var ts = new Date().toISOString().replace(/[:T]/g, "-").slice(0, 19);
        var namedFile = new File([file], "paste-" + ts + "." + ext, { type: file.type });
        var slug = currentFile.replace(/\.md$/, "").replace(/-/g, "_");
        uploadFiles([namedFile], slug, 0);
        return;
      }
    }
  }
  // Fallback for textarea (when CM is not loaded)
  document.addEventListener("paste", pasteImageIfAny);

  // ---- Server button ----
  function currentPreviewUrl() {
    var base = "http://localhost:1313";
    if (!currentFile) return base;
    var stem = currentFile.replace(/\.md$/, "");
    if (currentFile === "about.md") return base + "/about/";
    return base + "/posts/" + stem + "/";
  }

  serverBtn.addEventListener("click", function() {
    var url = currentPreviewUrl();
    flash("Starting server...");
    fetch("/api/server", { method: "POST" })
      .then(function() { setTimeout(function() { window.open(url, "_blank"); }, 2000); })
      .catch(function() { setTimeout(function() { window.open(url, "_blank"); }, 2000); });
  });

  // ---- Drag & Drop ----
  var dragN = 0;
  document.addEventListener("dragenter", function(e) {
    if (e.dataTransfer.types.indexOf("Files") >= 0) { dragN++; dropOverlay.classList.add("visible"); }
  });
  document.addEventListener("dragleave", function() {
    dragN--; if (dragN <= 0) { dragN = 0; dropOverlay.classList.remove("visible"); }
  });
  document.addEventListener("dragover", function(e) { e.preventDefault(); });
  document.addEventListener("drop", function(e) {
    e.preventDefault(); dragN = 0; dropOverlay.classList.remove("visible");
    if (!currentFile) { flash("Open a post first"); return; }
    var files = e.dataTransfer.files;
    if (!files.length) return;
    var slug = currentFile.replace(/\.md$/, "").replace(/-/g, "_");
    uploadFiles(files, slug, 0);
  });

  function uploadFiles(files, slug, i) {
    if (i >= files.length) return;
    var file = files[i];
    if (!file.type.startsWith("image/")) { flash("Skipped: " + file.name); uploadFiles(files, slug, i + 1); return; }
    var fd = new FormData();
    fd.append("file", file);
    flash("Uploading " + file.name + "...");
    fetch("/api/upload/" + encodeURIComponent(slug), { method: "POST", body: fd })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok) {
          var pos = E.getCursor();
          var fig = '\n<figure class=invertible style="max-width: 100%;">\n<img src="' + data.path + '">\n<figcaption></figcaption>\n</figure>\n';
          var captionCursor = fig.indexOf('<figcaption>') + '<figcaption>'.length;
          E.insertAt(pos, fig, captionCursor);
          flash("Added " + data.filename);
        }
        uploadFiles(files, slug, i + 1);
      })
      .catch(function() { flash("Upload failed"); uploadFiles(files, slug, i + 1); });
  }

  // ---- Resize ----
  var resizing = false;
  resizeHandle.addEventListener("mousedown", function(e) {
    resizing = true; resizeHandle.classList.add("dragging");
    document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none";
    e.preventDefault();
  });
  document.addEventListener("mousemove", function(e) {
    if (!resizing) return;
    var rect = document.getElementById("panes").getBoundingClientRect();
    var f = Math.max(0.15, Math.min(0.85, (e.clientX - rect.left) / rect.width));
    editorPane.style.flex = f;
    previewPane.style.flex = 1 - f;
  });
  document.addEventListener("mouseup", function() {
    if (resizing) {
      resizing = false; resizeHandle.classList.remove("dragging");
      document.body.style.cursor = ""; document.body.style.userSelect = "";
    }
  });

  // ---- Keys ----
  document.addEventListener("keydown", function(e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && e.key === "s") { e.preventDefault(); savePost(); }
    if (mod && e.key === "b") { e.preventDefault(); sidebarToggle.click(); }
    if (mod && e.key === "l") { e.preventDefault(); toggleWrap(); }
    if (mod && e.key === "e") {
      e.preventDefault();
      var txt = "\n$$\n\n$$\n";
      E.insertAt(E.getCursor(), txt, 4); // cursor between the $$ pairs
    }
    if (mod && e.key === "p" && !e.shiftKey) {
      e.preventDefault();
      if (!sidebarOpen) sidebarToggle.click();
      searchInput.focus(); searchInput.select();
    }
    if (mod && e.shiftKey && e.key === "S") { e.preventDefault(); doPublish(); }
  });

  // ---- Util ----
  function flash(msg) {
    statusMsg.textContent = msg;
    setTimeout(function() { if (statusMsg.textContent === msg) statusMsg.textContent = ""; }, 3000);
  }

  // ============================================================
  // CodeMirror — async load, upgrades textarea if successful
  // ============================================================
  async function loadCodeMirror() {
    try {
      var cmMod = await import("https://esm.sh/codemirror");
      var mdMod = await import("https://esm.sh/@codemirror/lang-markdown");
      var viewMod = await import("https://esm.sh/@codemirror/view");
      var stateMod = await import("https://esm.sh/@codemirror/state");
      var langMod = await import("https://esm.sh/@codemirror/language");
      var hlMod = await import("https://esm.sh/@lezer/highlight");

      var EditorView = cmMod.EditorView;
      var basicSetup = cmMod.basicSetup;
      var markdownLang = mdMod.markdown;
      var EditorState = stateMod.EditorState;
      var RangeSetBuilder = stateMod.RangeSetBuilder;
      var km = viewMod.keymap;
      var ViewPlugin = viewMod.ViewPlugin;
      var Decoration = viewMod.Decoration;
      var syntaxHighlighting = langMod.syntaxHighlighting;
      var HighlightStyle = langMod.HighlightStyle;
      var t = hlMod.tags;

      var isDark = document.documentElement.classList.contains("dark-mode");

      // ---- Color palette ----
      var colors = isDark ? {
        heading:    "#eda0b8",
        strong:     "#ddd8dc",
        emphasis:   "#c8a4f0",
        link:       "#89dceb",
        url:        "#74c7ec",
        code:       "#a6e3a1",
        meta:       "#585868",
        comment:    "#505060",
        separator:  "#404048",
        punct:      "#606070",
        list:       "#eda0b8",
        string:     "#a6e3a1",
      } : {
        heading:    "#c03060",
        strong:     "#333",
        emphasis:   "#7c3aed",
        link:       "#0870a8",
        url:        "#0d7ea0",
        code:       "#2e8b57",
        meta:       "#b0b0b0",
        comment:    "#bbbbbb",
        separator:  "#cccccc",
        punct:      "#aaaaaa",
        list:       "#c03060",
        string:     "#2e8b57",
      };

      var myStyle = HighlightStyle.define([
        { tag: t.heading,   color: colors.heading },
        { tag: t.heading1,  color: colors.heading },
        { tag: t.heading2,  color: colors.heading },
        { tag: t.heading3,  color: colors.heading },
        { tag: t.heading4,  color: colors.heading },
        { tag: t.strong,    color: colors.strong },
        { tag: t.emphasis,  color: colors.emphasis, fontStyle: "italic" },
        { tag: t.link,      color: colors.link },
        { tag: t.url,       color: colors.url },
        { tag: t.monospace, color: colors.code },
        { tag: t.meta,      color: colors.meta },
        { tag: t.comment,   color: colors.comment },
        { tag: t.contentSeparator, color: colors.separator },
        { tag: t.processingInstruction, color: colors.meta },
        { tag: t.punctuation, color: colors.punct },
        { tag: t.list,      color: colors.list },
        { tag: t.string,    color: colors.string },
        { tag: t.quote,     color: colors.emphasis },
      ]);

      var theme = EditorView.theme({
        "&": { height: "100%", backgroundColor: "var(--ide-editor-bg)" },
        ".cm-scroller": { overflow: "auto" },
        ".cm-content": { caretColor: "var(--ide-accent)" },
        ".cm-gutters": {
          backgroundColor: "var(--ide-editor-bg)",
          color: "var(--ide-fg2)",
          borderRight: "1px solid var(--ide-border)",
        },
      }, { dark: isDark });

      var saveKM = km.of([
        { key: "Mod-s", run: function() { savePost(); return true; } },
        { key: "Mod-e", run: function() {
          E.insertAt(E.getCursor(), "\n$$\n\n$$\n", 4);
          return true;
        }},
      ]);

      var updateListener = EditorView.updateListener.of(function(update) {
        if (update.docChanged) onEditorChange();
        if (update.selectionSet) {
          var pos = update.state.selection.main.head;
          var line = update.state.doc.lineAt(pos);
          statusCursor.textContent = "Ln " + line.number + ", Col " + (pos - line.from + 1);
        }
      });

      // ---- Math highlighting ----
      var mathMarkDeco = Decoration.mark({ class: "cm-math-mark" });
      var mathContentDeco = Decoration.mark({ class: "cm-math-content" });

      var mathPlugin = ViewPlugin.fromClass(
        class {
          constructor(view) { this.decorations = this._build(view.state); this._lastBuild = 0; }
          update(update) {
            if (update.docChanged) {
              var now = Date.now();
              if (now - this._lastBuild > 2000) {
                this.decorations = this._build(update.state);
                this._lastBuild = now;
              }
            }
          }
          _build(state) {
            var builder = new RangeSetBuilder();
            var text = state.doc.toString();
            var re = /\$\$[\s\S]*?\$\$|\$(?!\$|\s)(?:[^$\n\\]|\\.)*(?<!\s)\$/g;
            var m;
            while ((m = re.exec(text)) !== null) {
              var from = m.index;
              var to = from + m[0].length;
              var dLen = m[0].startsWith("$$") ? 2 : 1;
              builder.add(from, from + dLen, mathMarkDeco);
              if (to - from > dLen * 2)
                builder.add(from + dLen, to - dLen, mathContentDeco);
              builder.add(to - dLen, to, mathMarkDeco);
            }
            return builder.finish();
          }
        },
        { decorations: function(v) { return v.decorations; } }
      );

      var currentText = ta.value;
      var cmPlaceholder = viewMod.placeholder;

      var cmEditor = new EditorView({
        state: EditorState.create({
          doc: currentText,
          extensions: [
            basicSetup,
            markdownLang(),
            theme,
            syntaxHighlighting(myStyle),
            saveKM,
            updateListener,
            EditorView.lineWrapping,
            mathDecoField,
            mathPlugin,
            cmPlaceholder("Select a post from the sidebar to start editing."),
          ],
        }),
        parent: editorPane,
      });

      // Verify it rendered with actual height before switching
      requestAnimationFrame(function() {
        if (cmEditor.dom.clientHeight > 50) {
          ta.style.display = "none";
          E._cm = cmEditor;
          // Capture-phase paste handler ensures we intercept image pastes
          // before CM processes them (CM does not handle images, just text)
          cmEditor.contentDOM.addEventListener("paste", pasteImageIfAny, true);
          setupEditorScroll();
          flash("Syntax highlighting loaded");
        } else {
          // CM didn't size properly — destroy and keep textarea
          cmEditor.destroy();
          console.warn("CodeMirror rendered at 0 height, keeping textarea");
        }
      });

    } catch (e) {
      console.error("CodeMirror load error:", e);
      flash("CM failed: " + (e.message || e));
    }
  }

  // ---- Init ----
  if (window.markedFootnote) marked.use(markedFootnote());

  loadPosts(function() {
    var params = new URLSearchParams(location.search);
    var fileParam = params.get("file");
    if (fileParam) openPost(fileParam);
  });

  loadCodeMirror();
})();
</script>

</body>
</html>
