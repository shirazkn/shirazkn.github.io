<script>
  function preprocessMathEscapes() {
    const content = document.querySelector('.post-content');
    if (!content) return;
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (node.parentElement && node.parentElement.closest('pre, code')) {
          return NodeFilter.FILTER_SKIP;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let node;
    while ((node = walker.nextNode())) {
      if (node.nodeValue.includes('\\_')) {
        node.nodeValue = node.nodeValue.replace(/\\_/g, '_');
      }
    }
  }

  // Inline math can't wrap, so a formula wider than its line would widen the whole
  // page (mostly on phones). Let just those few scroll on their own.
  function markWideInlineMath() {
    for (const m of document.querySelectorAll('.post-content mjx-container:not([display="true"])')) {
      m.classList.remove('mjx-wide');
      // Measure against the nearest block box (math often sits inside inline spans)
      let p = m.parentElement;
      while (p.parentElement && getComputedStyle(p).display.startsWith('inline')) p = p.parentElement;
      const cs = getComputedStyle(p);
      const available = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (m.getBoundingClientRect().width > available + 0.5) m.classList.add('mjx-wide');
    }
  }

  MathJax = {
    tex: {
      packages: {'[+]': ['mathtools', 'amscd']},
      displayMath: [['\\[', '\\]'], ['$$', '$$']],  // block
      inlineMath: [['\\(', '\\)'], ['$', '$']]  // inline
    },
    loader:{
      load: ['ui/safe', '[tex]/mathtools', '[tex]/amscd']
    },
    startup: {
      ready() {
        preprocessMathEscapes();
        MathJax.startup.defaultReady();
        MathJax.startup.promise.then(() => {
          markWideInlineMath();
          let resizeRaf = null;
          window.addEventListener('resize', () => {
            cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(markWideInlineMath);
          });
        });
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
